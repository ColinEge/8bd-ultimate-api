# Bindables
# ---------
# Bindables is a list of key usages that can be assigned to a keyboard key.
# The top-level keys represent logical categories and are ordered to match
# the groups shown in the official 8BitDo Ultimate Software V2.

# Each bindable is represented as a 3-byte HID usage tuple:
#
#   [page]-[mod]-[key]
#
# Byte meanings:
#
# 1. page — HID usage page
# 2. mod  — modifier usage ID (if applicable)
# 3. key  — standard usage ID
#
# These values follow the USB HID Usage Tables specification:
# https://www.usb.org/sites/default/files/hut1_5.pdf

# Bindable Usage Format
# ---------------------
# Bindable actions are represented by a sequence of bytes describing
# a HID usage or firmware-specific action.
#
# The encoding depends on the HID usage page.

# Keyboard Page (0x07)
# --------------------
# Keyboard keys follow a structured 3-byte encoding:
#
#   [page]-[mod]-[key]
#
# page : HID usage page (always 0x07)
# mod  : modifier usage ID (if present)
# key  : standard key usage ID
#
# Examples:
#   07-00-06  -> C
#   07-e0-00  -> Left Control
#   07-e0-06  -> Left Control + C
#
# This structure allows modifier chords to be represented in a
# single usage tuple.

# Other Usage Pages
# -----------------
# Bindings from other usage pages (mouse functions, consumer controls,
# shortcuts, etc.) do not follow the same structure as page 0x07.
#
# These usages should be treated as opaque byte sequences defined by
# the keyboard firmware.
#
# The length and internal structure may vary.

# Mouse Functions
# ---------------
# Mouse-related bindings use a page value of 0x01 rather than the
# standard HID button page (0x09). This appears to be a firmware
# convention used by the 8BitDo keyboard.
#
# Some mouse actions are simple 3-byte usages:
#
#   01-01-00 -> Primary Click
#   01-02-00 -> Right Click
#
# Others encode scrolling actions using longer byte sequences:
#
#   01-00-00-00-02 -> Scroll Up
#   01-00-00-00-fe -> Scroll Down
#
# These should be treated as device-specific encodings.

# Consumer / Shortcut Page (0x0C)
# --------------------------------
# Consumer controls use page 0x0C and often contain values in both
# the second and third bytes.
#
# Example:
#   0c-92-01 -> Launch Calculator
#   0c-23-02 -> Open Default Browser
#
# These usages do not represent modifier chords and should not be
# interpreted using the keyboard-page rules.

