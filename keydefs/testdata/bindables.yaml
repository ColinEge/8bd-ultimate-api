# KeyOnly
# -------
# Some physical keys exist on the keyboard but cannot be assigned
# as bindings in the firmware. These are listed in the KeyOnly
# category so they can appear in keyboard layouts but are excluded
# from bindable usage lists.
KeyOnly:
  07-e9-00:
    keyLabel: "A!" # (Super A)
  07-e8-00:
    keyLabel: "B!" # (Super B)

